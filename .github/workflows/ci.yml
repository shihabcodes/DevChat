name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Type check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      # Public values (they ship to every browser). Needed at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://libddkiwpjvqoedpqeqx.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1hdXHfeY7IV5qgifdNVlZQ_MGj1Zo0Q
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
